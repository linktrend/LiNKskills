# Executable confined consumer-profile suite. Source execution is not a usable promotion.
skill_id: meeting-management
suite_version: 1.0.0
rubric:
- dimension: agenda_and_prebrief
  weight: 0.2
  hard_fail_below: 0.7
- dimension: notes_decisions_and_followup
  weight: 0.25
  hard_fail_below: 0.7
- dimension: routing_and_authority
  weight: 0.2
  hard_fail_below: 0.8
- dimension: candidate_maintenance
  weight: 0.15
- dimension: transcript_privacy
  weight: 0.2
  hard_fail_below: 0.9
pass_threshold: 0.85
scenarios:
- id: agenda-and-prebrief
  input: Prepare an agenda and a private pre-brief from a synthetic objective.
  expected_criteria:
  - includes objective, time boxes, decisions, and evidence prompts
  - keeps the pre-brief private
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - agenda-and-prebrief
    timeout_seconds: 15
  assertions:
    must_contain:
    - agenda-and-prebrief
    - PASS
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: redacted-notes
  input: Process supplied redacted notes and a transcript reference.
  expected_criteria:
  - returns a concise summary with evidence pointers
  - does not retain raw transcript text
  execute:
