    - REDACTED
    - remainder-privacy-redact-secret-pointer
    - redact
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
    must_not_contain:
    - raw-secret-value
judge:
  min_reasoning_tier: high
suite_id: meeting-management-eval
