# Executable confined consumer-profile suite. Source execution is not a usable promotion.
skill_id: operational-reporting
suite_version: 1.0.0
pass_threshold: 0.85
rubric:
- dimension: mode_contract
  weight: 0.15
  hard_fail_below: 0.7
- dimension: verification_and_omission
  weight: 0.2
  hard_fail_below: 0.7
- dimension: source_boundaries
  weight: 0.2
  hard_fail_below: 0.8
- dimension: mobile_concision
  weight: 0.15
- dimension: privacy_and_transport
  weight: 0.15
  hard_fail_below: 0.8
- dimension: migration_and_checkpoint
  weight: 0.15
scenarios:
- id: morning-executive-delta
  expected_criteria:
  - verified completed work
  - empty sections omitted
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - morning-executive-delta
    timeout_seconds: 15
  assertions:
    must_contain:
    - morning-executive-delta
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
