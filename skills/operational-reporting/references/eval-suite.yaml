    - trading-performance-complete-fixture
    timeout_seconds: 15
  assertions:
    must_contain:
    - trading-performance-complete-fixture
    - PASS
    - method_fixture_pass
    - permission_to_act
    json_schema_fields: [status, case_id]
    exit_code: 0
- id: trading-performance-partial-fixture
