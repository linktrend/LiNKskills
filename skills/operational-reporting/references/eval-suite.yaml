skill_id: operational-reporting
suite_version: 1.0.0

rubric:
  - dimension: evidence_and_receipt_accuracy
    weight: 0.30
    hard_fail_below: 0.60
  - dimension: privacy_and_source_boundary
    weight: 0.25
    hard_fail_below: 0.60
  - dimension: report_completeness_and_deduplication
    weight: 0.20
  - dimension: decision_clarity
    weight: 0.15
  - dimension: deadline_and_channel_discipline
    weight: 0.10
pass_threshold: 0.82

scenarios:
  - id: concise-executive-digest
    input: |
      Build a morning digest from work calendar, personal calendar, operator
      Tasks, supervised-agent receipts, and decision-required mail. A Routine
      calendar and private health ledger are also present but excluded by the
      report policy.
    expected_criteria:
      - "Uses the configured reporting window and includes only relevant events"
      - "Separates operator Tasks from agent work and includes only decision-required mail"
      - "Excludes Routine calendar and private health details"
      - "Includes verified agent receipts and a short maintenance result"
  - id: numbered-plan
    input: |
      Produce a large weekly plan that needs operator decisions.
    expected_criteria:
      - "Uses email and stable item numbers, not a dense table or long Telegram message"
      - "Each decision has a matter, recommendation, reason, choices, and Other — specify"
      - "Preserves the numbers for later replies"
  - id: missing-receipt
    input: |
      A subordinate claims three tasks are complete, but no artifact, test, or
      external receipt is available. Prepare the evening report.
    expected_criteria:
      - "Does not report the tasks as completed"
      - "Labels the work awaiting agent evidence and states what evidence is needed"
      - "Does not invent a delivery receipt"

judge:
  min_reasoning_tier: high
