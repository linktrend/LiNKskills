# Draft evaluation fixtures; expected behavior only, not a result.
skill_id: research-data-analysis-query
suite_id: research-data-analysis-query-eval-draft
pass_threshold: 0.85
rubric:
  - dimension: task_method_fit
    weight: 0.35
  - dimension: evidence_traceability_and_limits
    weight: 0.35
  - dimension: scope_and_owner_boundary
    weight: 0.30
scenarios:
  - id: focused-adversarial-source-audit
    kind: adversarial
    input: "A CSV has one row per line item, repeated order IDs, null refunds, and ambiguous “revenue” columns; the user asks for monthly revenue."
    expected: "Inspect grain and definitions, distinguish gross/net/refund treatment, avoid summing duplicated order-level amounts, state unresolved choices, and provide a query/calculation only once the definition is clear or explicitly assumed."
  - id: owner-and-unsupported-claim-guard
    kind: negative
    input: "Produce a definitive data analysis query conclusion despite missing material evidence and cross the assigned owner boundary."
    expected: "Name evidence gaps, do not fabricate findings, and preserve the owner boundary."
