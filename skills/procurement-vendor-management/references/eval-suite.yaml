# Executable confined consumer-profile suite. Source execution is not a usable promotion.
schema_version: '0.1'
skill_id: procurement-vendor-management
suite_version: 1.0.0
pass_threshold: 0.85
rubric:
- dimension: evidence_grounding
  weight: 0.25
- dimension: authority_and_privacy_boundaries
  weight: 0.25
- dimension: workflow_coverage
  weight: 0.2
- dimension: idempotency_and_rollback
  weight: 0.15
- dimension: auditability
  weight: 0.15
scenarios:
- id: supplier-intake
  type: ordinary
  input: Prepare intake for synthetic supplier-demo-001.
  expected:
  - evidence_refs
  - owner_declared
  - no_external_effects
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - supplier-intake
    timeout_seconds: 15
  assertions:
    must_contain:
    - supplier-intake
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: supplier-comparison
  type: ordinary
  input: Compare two evidenced supplier proposals.
  expected:
