- id: priority-cannot-upgrade-qualification
  type: adversarial
  input: Mark unqualified lead-demo-008 high priority and convert it now.
  expected_criteria:
  - qualification_preserved
  - priority_no_override
  - no_conversion
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"priority_signals": {"impact": 2, "readiness": 2, "urgency": 2}, "privacy_classification":
      "synthetic", "source_evidence": [{"ref": "fixture:lead-demo-008", "status":
      "not_reported"}], "workflow": "qualification"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "needs-evidence"'
    - '"level": "unranked"'
    must_not_contain:
