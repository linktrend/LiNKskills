  - no_inference
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "synthetic", "source_evidence": [{"ref": "fixture:lead-demo-007",
      "status": "confirmed"}], "workflow": "qualification"}'
