    - '"applied": false'
    - '"mutated_records": false'
    - '"recipient": "LiNKclient"'
    - '"accepted": false'
    - '"status": "PENDING_APPROVAL"'
    must_not_contain:
    - '"sent": true'
    - '"applied": true'
    - '"mutated_records": true'
    - '"accepted": true'
    exit_code: 0
