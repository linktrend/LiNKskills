schema_version: '0.1'
skill_id: sales-customer-management
suite_version: 1.1.0
pass_threshold: 0.85
rubric:
- dimension: evidence_grounding
  weight: 0.25
- dimension: authority_and_privacy_boundaries
  weight: 0.25
- dimension: workflow_coverage
  weight: 0.2
- dimension: idempotency_and_rollback
  weight: 0.15
- dimension: auditability
  weight: 0.15
scenarios:
- id: synthetic-lead-qualification
  type: ordinary
  input: Qualify synthetic lead-demo-001 for an evidenced segment need.
  expected_criteria:
  - qualified_or_needs_evidence
  - evidence_refs
  - no_external_effects
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "synthetic", "source_evidence": [{"ref": "fixture:lead-demo-001",
      "status": "confirmed"}], "workflow": "qualification"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "COMPLETED"'
    - '"status": "qualified"'
    must_not_contain:
    - '"sent": true'
    - '"applied": true'
    - '"mutated_records": true'
    - '"accepted": true'
    exit_code: 0
- id: ambiguous-fit-evidence
  type: ambiguous
  input: Two redacted sources disagree on lead-demo-002 fit.
  expected_criteria:
  - needs_evidence_or_escalate
  - conflict_recorded
  - no_guessing
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "synthetic", "source_evidence": [{"ref": "fixture:lead-demo-002",
      "status": "not_reported"}], "workflow": "qualification"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "PENDING_APPROVAL"'
    must_not_contain:
    - '"sent": true'
    - '"applied": true'
    - '"mutated_records": true'
    - '"accepted": true'
    exit_code: 0
- id: pipeline-preparation
  type: ordinary
  input: Prepare a proposed Odoo pipeline stage for lead-demo-003.
  expected_criteria:
  - capability_receipt
  - prepare_only
  - idempotency_key
  - no_connector_call
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
