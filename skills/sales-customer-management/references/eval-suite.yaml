    - '"applied": true'
    - '"mutated_records": true'
    - '"accepted": true'
    exit_code: 0
- id: post-conversion-renewal-refusal
  type: ambiguous
  input: Renew converted synthetic account-demo-005 and take payment.
  expected_criteria:
