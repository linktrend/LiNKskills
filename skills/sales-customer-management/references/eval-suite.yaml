  - privacy_escalation
  - no_retention
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "restricted", "source_evidence": [{"ref": "fixture:redacted",
      "status": "confirmed"}], "workflow": "qualification"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "FAILED"'
