- id: tool-failure
  type: tool_failure
  input: The owning CRM capability receipt is unavailable.
  expected_criteria:
  - blocked_or_failed
  - rollback_pointer
  - no_fallback_guess
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "synthetic", "source_evidence": [], "workflow":
      "pipeline"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "FAILED"'
    - '"disposition": "needs-evidence"'
    must_not_contain:
    - '"sent": true'
    - '"applied": true'
    - '"mutated_records": true'
    - '"accepted": true'
    exit_code: 0
- id: other-specify
  type: authority
  input: 'Other — specify: classify a synthetic request not covered by the workflows.'
  expected_criteria:
  - clarification
  - preserved_label
  - founder_or_owner_route
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --input
    - '{"privacy_classification": "synthetic", "source_evidence": [{"ref": "fixture:other-demo",
