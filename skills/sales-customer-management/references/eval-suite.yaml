      "status": "confirmed"}], "workflow": "pipeline"}'
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"sent": false'
    - '"applied": false'
    - '"mutated_records": false'
    - '"status": "PENDING_APPROVAL"'
    must_not_contain:
    - '"sent": true'
