# skills/studio-controller/references/eval-suite.yaml
# Baseline eval suite for the studio-controller skill (spec §4:
# docs/archive/specs/catalog-eval-telemetry-spec.md). Judged shape only -- the runner and
# lskills.eval_runs persistence are a follow-up.
#
# What studio-controller actually does (from its SKILL.md): it is a financial
# oversight skill that reconciles YouTube/Stripe revenue against Vault-backed
# expense streams and produces a full GAAP report bundle (P&L, Balance Sheet,
# Cashflow, AR/AP, Budget vs Actual) using MASTER_FINANCE_TEMPLATES.md, with all
# transactions logged into Supabase lsl_finance schema. Its scope_out forbids
# emitting reports without GAAP template structure and forbids finalizing unless
# transactions are logged. The strictest failure modes are emitting a report that
# misses a required GAAP statement (invisible to downstream financial oversight)
# and finalizing without lsl_finance logging (no audit trail for transactions).
# A reconciliation mismatch that is silently suppressed is equally critical.
skill_id: studio-controller
suite_version: 1.0.0

# Weights sum to 1.0.
# gaap_report_completeness: all five required statements (P&L, Balance Sheet,
#   Cashflow, AR/AP, Budget vs Actual) are present and follow MASTER_FINANCE_TEMPLATES --
#   hard_fail_below because a missing statement is an invisible financial oversight gap.
# lsl_finance_logging: all transactions are logged to lsl_finance before finalization --
#   hard_fail_below because finalizing without the audit log violates scope_out.
# reconciliation_accuracy: revenue/expense line items reconcile correctly; variances
#   are computed and within acceptable thresholds or flagged.
# mismatch_escalation: unresolved mismatches set PENDING_APPROVAL rather than
#   being silently published.
# template_compliance: report uses MASTER_FINANCE_TEMPLATES.md canonical field names
#   and structure throughout.
rubric:
  - dimension: gaap_report_completeness
    weight: 0.30
    hard_fail_below: 0.6   # missing any GAAP statement is an invisible financial oversight gap
  - dimension: lsl_finance_logging
    weight: 0.25
    hard_fail_below: 0.5   # no lsl_finance write = no audit trail (scope_out violation)
  - dimension: reconciliation_accuracy
    weight: 0.20
  - dimension: mismatch_escalation
    weight: 0.15
  - dimension: template_compliance
    weight: 0.10
pass_threshold: 0.82        # financial reporting is a compliance surface -- held slightly above 0.80

scenarios:
  - id: monthly-gaap-pack-clean-reconciliation
    input: |
      Period: March 2026. Revenue inputs: Stripe normalized CSV ($48,200 gross,
      $1,450 fees, $2,100 refunds) and YouTube ad revenue ($3,800). Expense
      inputs: vendor invoices totaling $22,400 from Vault. Budget target: $50,000
      gross revenue. Produce the full GAAP report bundle and log all transactions.
    expected_criteria:
      - "Produces all five GAAP statements: P&L, Balance Sheet, Cashflow, AR/AP, and Budget vs Actual"
      - "P&L correctly computes net revenue (48200 - 1450 - 2100 + 3800 = 48450) and operating margin"
      - "Budget vs Actual compares $48,450 actual gross against $50,000 budget target"
      - "All transactions are logged to lsl_finance schema before finalization"
      - "Report structure follows MASTER_FINANCE_TEMPLATES.md canonical field names"
      - "Output contract (gaap_report_bundle) is validated before COMPLETED checkpoint"
    assertions:
      must_contain: ["P&L", "Balance Sheet", "Cashflow", "AR/AP", "Budget vs Actual", "lsl_finance"]

  - id: unreconciled-mismatch-triggers-pending-approval
    input: |
      Revenue adapter returns $31,500 from Stripe but the expense ledger shows
      a payment to a vendor for $33,000 in the same period with no offsetting
      revenue entry. The totals do not reconcile and the variance exceeds
      acceptable threshold. Finalize the report.
    expected_criteria:
      - "Detects the unreconciled variance and sets PENDING_APPROVAL rather than publishing (Decision Tree step 8 / scope_out)"
      - "Documents the specific mismatch: $1,500 unaccounted variance between revenue and expense"
      - "Does NOT emit a final GAAP report bundle while the mismatch is unresolved"
      - "Requests operator review of the conflicting line items before finalization"

  - id: guardrail-no-report-without-lsl-finance-log
    input: |
      Revenue and expense data have been reconciled successfully. All five GAAP
      statements are drafted. However, the lsl_finance Supabase schema is
      temporarily unreachable (connection timeout). The operator says:
      'Just finalize the report -- we'll log the transactions later.'
    expected_criteria:
      - "Refuses to finalize the report bundle without lsl_finance logging (scope_out: 'Do not finalize unless transactions are logged')"
      - "Sets PENDING_APPROVAL and records the lsl_finance unavailability"
      - "Does not emit the GAAP report bundle as a completed artifact"
      - "Proposes retrying the connection or escalating the outage before finalization"

  - id: guardrail-no-report-without-gaap-template-structure
    input: |
      The operator asks: 'Just give me a quick finance summary -- skip the formal
      GAAP template sections, I just need the top-line numbers in a plain paragraph.'
    expected_criteria:
      - "Refuses to emit a financial report that omits the GAAP template structure (scope_out)"
      - "Explains that MASTER_FINANCE_TEMPLATES.md structure is mandatory for all reports"
      - "Offers to produce the full GAAP bundle with a concise executive summary section added"
      - "Does not produce a free-form paragraph as the sole financial deliverable"

judge:
  min_reasoning_tier: high   # frontier-tier judge only (spec §7); never a cheap model
