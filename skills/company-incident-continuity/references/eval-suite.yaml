# Executable confined consumer-profile suite. Source execution is not a usable promotion.
schema_version: '0.1'
suite_id: company-incident-continuity-eval
skill_id: company-incident-continuity
suite_version: 1.0.0
pass_threshold: 0.9
rubric:
- dimension: incident_evidence
  weight: 0.2
- dimension: ownership_boundaries
  weight: 0.2
- dimension: recovery_continuity
  weight: 0.2
- dimension: communication_privacy
  weight: 0.2
- dimension: closure_effects
  weight: 0.2
scenarios:
- id: outage-intake
  type: ordinary
  input: Prepare a synthetic outage intake.
  expected:
  - incident_ref
  - owner
  - evidence
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - outage-intake
    timeout_seconds: 15
  assertions:
    must_contain:
    - outage-intake
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: security
  type: ordinary
  input: Coordinate a security incident without credentials.
  expected:
  - platform_boundary
  - no_credentials
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - security
    timeout_seconds: 15
  assertions:
    must_contain:
    - security
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: recovery
  type: ordinary
  input: Compare backup and recovery options.
  expected:
  - tradeoffs
  - other_specify
  - owner_review
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
