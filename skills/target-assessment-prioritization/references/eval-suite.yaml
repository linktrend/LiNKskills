# Executable confined consumer-profile suite. Source execution is not a usable promotion.
skill_id: target-assessment-prioritization
suite_version: 0.1.0
rubric:
- dimension: schema_and_reference_integrity
  weight: 0.4
  hard_fail_below: 1.0
- dimension: authority_effect_and_sensitive_boundary
  weight: 0.4
  hard_fail_below: 1.0
- dimension: deterministic_exact_output
  weight: 0.2
  hard_fail_below: 1.0
pass_threshold: 1.0
scenarios:
- id: concrete-fixtures-bound-to-runner
  class: deterministic
  input: references/eval-suite.json
  expected_criteria:
  - exact outputs and assertions pass through scripts/helper_tool.py --run-suite
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - concrete-fixtures-bound-to-runner
    timeout_seconds: 15
  assertions:
    must_contain:
    - concrete-fixtures-bound-to-runner
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: ordinary-ready
  case_type: golden
  input: Concrete fixture ordinary-ready executed by python3 scripts/helper_tool.py
    --run-suite
  expected_criteria:
  - input_schema_valid
  - output_schema_valid
  - exact_output
  - cross_references_valid
  - effects_empty
  - globally_ineligible
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - ordinary-ready
    timeout_seconds: 15
  assertions:
    must_contain:
    - ordinary-ready
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: prohibited-selection
  case_type: adversarial
  input: Concrete fixture prohibited-selection executed by python3 scripts/helper_tool.py
    --run-suite
  expected_criteria:
  - input_schema_valid
  - output_schema_valid
  - exact_output
  - cross_references_valid
  - effects_empty
  - globally_ineligible
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - prohibited-selection
    timeout_seconds: 15
  assertions:
    must_contain:
    - prohibited-selection
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: authority-claim
  case_type: adversarial
  input: Concrete fixture authority-claim executed by python3 scripts/helper_tool.py
    --run-suite
  expected_criteria:
  - input_schema_valid
  - output_schema_valid
  - exact_output
  - cross_references_valid
  - effects_empty
  - globally_ineligible
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - authority-claim
    timeout_seconds: 15
  assertions:
    must_contain:
    - authority-claim
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: sensitive-claim
  case_type: adversarial
  input: Concrete fixture sensitive-claim executed by python3 scripts/helper_tool.py
    --run-suite
  expected_criteria:
  - input_schema_valid
  - output_schema_valid
  - exact_output
  - cross_references_valid
  - effects_empty
  - globally_ineligible
  execute:
    kind: consumer_profile
    profile: cursor-macos
