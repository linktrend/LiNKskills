    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: other-specify
  type: authority
  input: 'Other - specify: classify an unfamiliar legal-operations request.'
  expected:
  - clarification
  - preserved_label
  - lawyer_or_principal_route
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
