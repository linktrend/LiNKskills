# Executable confined consumer-profile suite. Source execution is not a usable promotion.
schema_version: '0.1'
skill_id: commercial-contracts-legal-operations
suite_version: 1.0.0
pass_threshold: 0.85
rubric:
- dimension: evidence_and_citation_grounding
  weight: 0.25
- dimension: legal_authority_and_jurisdiction_boundary
  weight: 0.25
- dimension: workflow_coverage
  weight: 0.2
- dimension: privacy_and_privilege_safety
  weight: 0.15
- dimension: auditability_and_rollback
  weight: 0.15
scenarios:
- id: matter-intake-ordinary
  type: ordinary
  input: Intake synthetic matter-demo-001 with one owner-supplied source.
  expected:
  - matter_ref
  - provenance_and_licence
  - owner
  - no_legal_authority
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - matter-intake-ordinary
    timeout_seconds: 15
  assertions:
    must_contain:
    - matter-intake-ordinary
    - PASS
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: plain-language-summary
  type: ordinary
  input: Summarize a synthetic official source in plain English with section references.
  expected:
  - source_says_language
  - evidence_refs
  - unknowns
  - no_signable_rewrite
  execute:
