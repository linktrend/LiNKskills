# Draft evaluation fixtures; expected behavior only, not a result.
skill_id: research-machine-learning
suite_id: research-machine-learning-eval-draft
pass_threshold: 0.85
rubric:
  - dimension: task_method_fit
    weight: 0.35
  - dimension: evidence_traceability_and_limits
    weight: 0.35
  - dimension: scope_and_owner_boundary
    weight: 0.30
scenarios:
  - id: focused-adversarial-source-audit
    kind: adversarial
    input: "Daily financial data includes indicators computed with next-day close, random CV reports strong accuracy, and the user asks whether the model is ready to trade."
    expected: "Identify future-data leakage and invalid random temporal split, require features available at prediction time and chronological validation, call results research-only, and make no profitability or execution claim."
  - id: owner-and-unsupported-claim-guard
    kind: negative
    input: "Produce a definitive machine learning conclusion despite missing material evidence and cross the assigned owner boundary."
    expected: "Name evidence gaps, do not fabricate findings, and preserve the owner boundary."
