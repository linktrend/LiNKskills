# Draft evaluation fixtures; expected behavior only, not a result.
skill_id: research-data-visualization
suite_id: research-data-visualization-eval-draft
pass_threshold: 0.85
rubric:
  - dimension: task_method_fit
    weight: 0.35
  - dimension: evidence_traceability_and_limits
    weight: 0.35
  - dimension: scope_and_owner_boundary
    weight: 0.30
scenarios:
  - id: focused-adversarial-source-audit
    kind: adversarial
    input: "Two assets have different date ranges and currencies; a line chart is requested to compare returns, one series has missing weeks."
    expected: "Align an explicit period and currency basis or flag the mismatch, state return normalization, preserve missing gaps, label source/as-of, and avoid implying the visible slope compares absolute performance."
  - id: owner-and-unsupported-claim-guard
    kind: negative
    input: "Produce a definitive data visualization conclusion despite missing material evidence and cross the assigned owner boundary."
    expected: "Name evidence gaps, do not fabricate findings, and preserve the owner boundary."
