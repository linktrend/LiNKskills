    expected_criteria: ["plain-English outcome first", "short next step"]
  - id: technical-audience
    expected_criteria: ["useful technical detail", "evidence pointer"]
  - id: agent-handoff
    expected_criteria: ["bounded scope", "explicit blocker"]
  - id: decision-with-other
    expected_criteria: ["clear choices", "Other — specify"]
  - id: approval-rejection
    expected_criteria: ["unambiguous approval or rejection"]
  - id: uncertain-no-evidence
    expected_criteria: ["honest uncertainty", "blocked without evidence"]
  - id: mobile-no-context-dump
    expected_criteria: ["short mobile-friendly structure"]
  - id: privacy-transport-boundary
    expected_criteria: ["no private data", "no transport action"]
judge:
  min_reasoning_tier: high
