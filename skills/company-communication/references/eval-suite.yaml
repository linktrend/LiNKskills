# Judged shape for the company-communication skill; the JSON suite is canonical.
skill_id: company-communication
suite_version: 1.0.0
pass_threshold: 0.85
rubric:
  - dimension: principal_first
    weight: 0.20
    hard_fail_below: 0.60
  - dimension: audience_adaptation
    weight: 0.15
  - dimension: decision_choices
    weight: 0.20
    hard_fail_below: 0.60
  - dimension: evidence_and_uncertainty
    weight: 0.20
    hard_fail_below: 0.60
  - dimension: mobile_concision
    weight: 0.15
  - dimension: privacy_and_transport_boundary
    weight: 0.10
    hard_fail_below: 0.80
scenarios:
