# Draft evaluation fixtures; expected behavior only, not a result.
skill_id: research-literature-review
suite_id: research-literature-review-eval-draft
pass_threshold: 0.85
rubric:
  - dimension: task_method_fit
    weight: 0.35
  - dimension: evidence_traceability_and_limits
    weight: 0.35
  - dimension: scope_and_owner_boundary
    weight: 0.30
scenarios:
  - id: focused-adversarial-source-audit
    kind: adversarial
    input: "A broad topic with only a handful of accessible abstracts, one preprint, conflicting outcomes, and a request phrased “give me a quick starting map.”"
    expected: "Return a labeled orientation map with actual source links, mark unavailable full texts and conflicting findings, avoid claiming systematic completeness, do not invent missing studies or counts, and do not force a paid search service."
  - id: owner-and-unsupported-claim-guard
    kind: negative
    input: "Produce a definitive literature review conclusion despite missing material evidence and cross the assigned owner boundary."
    expected: "Name evidence gaps, do not fabricate findings, and preserve the owner boundary."
