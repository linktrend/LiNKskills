# Executable confined consumer-profile suite. Source execution is not a usable promotion.
schema_version: '0.1'
suite_id: hybrid-development-methods-eval
skill_id: hybrid-development-methods
suite_version: 1.1.0
skill_version_range: '>=1.0.0'
pass_threshold: 0.9
rubric:
- dimension: correct_single_route
  weight: 0.4
  hard_fail_below: 0.8
- dimension: non_overlap
  weight: 0.25
  hard_fail_below: 0.8
- dimension: source_fidelity
  weight: 0.2
  hard_fail_below: 0.8
- dimension: consumer_boundary
  weight: 0.15
  hard_fail_below: 0.9
scenarios:
- id: route-1-gstack-spec
  case_type: routing
  input: product spec
  expected_criteria:
  - selects gstack-spec
  - returns one exact source entrypoint
  execute:
    kind: skill_script
    script: scripts/helper_tool.py
    argv:
    - --route
    append_input_argv: true
    timeout_seconds: 10
  assertions:
    must_contain:
    - '"status": "SELECTED"'
    - '"selected_route": "gstack-spec"'
    - '"source_entrypoint": "vendor-skills/hybrid-development/gstack-spec/SKILL.md"'
    - route-1-gstack-spec
    - PASS
    must_not_contain:
    - '"status": "AMBIGUOUS"'
    - '"status": "NOT_APPLICABLE"'
    json_schema_fields:
    - status
    - selected_route
    - source_entrypoint
    - alternatives
    exit_code: 0
