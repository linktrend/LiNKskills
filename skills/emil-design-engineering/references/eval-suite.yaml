# Executable confined consumer-profile suite. Source execution is not a usable promotion.
skill_id: emil-design-engineering
suite_version: 1.0.0
pass_threshold: 0.9
rubric:
- dimension: correct_single_route
  weight: 0.4
  hard_fail_below: 0.8
- dimension: non_overlap
  weight: 0.25
  hard_fail_below: 0.8
- dimension: source_fidelity
  weight: 0.2
  hard_fail_below: 0.8
- dimension: consumer_boundary
  weight: 0.15
  hard_fail_below: 0.9
scenarios:
- id: route-1-emil-animate-expo
  expected_criteria:
  - selects emil-animate-expo
  - loads one source entrypoint
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - route-1-emil-animate-expo
    timeout_seconds: 15
  assertions:
    must_contain:
    - route-1-emil-animate-expo
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
