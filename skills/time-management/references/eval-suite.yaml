  assertions:
    must_contain:
    - reviews-reports-rules
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: read-only-research
  case_type: golden
  input: Research an unknown dependency without contacting a third party.
  expected_criteria:
  - allows read-only research
