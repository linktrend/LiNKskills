# Executable confined consumer-profile suite. Source execution is not a usable promotion.
skill_id: time-management
suite_version: 1.0.0
rubric:
- dimension: intake_and_authority
  weight: 0.2
  hard_fail_below: 0.7
- dimension: priority_capacity_and_periods
  weight: 0.25
  hard_fail_below: 0.7
- dimension: status_evidence_and_reviews
  weight: 0.2
  hard_fail_below: 0.7
- dimension: planning_horizons_and_reporting
  weight: 0.15
- dimension: ownership_privacy_and_effects
  weight: 0.2
  hard_fail_below: 0.8
pass_threshold: 0.85
scenarios:
- id: confirmed-intake-receipt
  input: Capture a confirmed task receipt with owner, estimate, deadline, dependency,
    and evidence.
  expected_criteria:
  - preserves the receipt fields and stable task reference
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - confirmed-intake-receipt
    timeout_seconds: 15
  assertions:
    must_contain:
    - confirmed-intake-receipt
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: provisional-inferred-action
  input: A conversation implies a follow-up without assignment.
  expected_criteria:
  - labels the action Provisional and does not commit it
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
    - provisional-inferred-action
    timeout_seconds: 15
  assertions:
    must_contain:
    - provisional-inferred-action
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: priority-capacity-evidence
  input: Plan deadline, unblocking, and optional work around protected periods.
  expected_criteria:
  - orders deadline and unblocking work before optional work
  - requires evidence for agent completion
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
