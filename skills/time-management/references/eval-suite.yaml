    timeout_seconds: 15
  assertions:
    must_contain:
    - status-evidence
    - REFUSED
    - ungoverned
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
    must_not_contain:
    - usable
- id: protected-periods
  case_type: golden
