    exit_code: 0
- id: status-evidence
  case_type: negative
  input: An agent says completed without a verification receipt.
  expected_criteria:
  - does not report Verified complete
  - requests evidence
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
    argv:
    - --case
