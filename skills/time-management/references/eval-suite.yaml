    - priority-capacity-evidence
    timeout_seconds: 15
  assertions:
    must_contain:
    - priority-capacity-evidence
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: flexible-capacity
  input: Evaluate a flexible period and reduced capacity.
  expected_criteria:
  - checks the five conditions and asks about time off
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
