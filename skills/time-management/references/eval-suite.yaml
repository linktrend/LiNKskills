    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: priority-order
  case_type: golden
  input: Plan a deadline, an unblocking task, and an optional improvement.
  expected_criteria:
  - deadline and unblocking precede optional work
  execute:
