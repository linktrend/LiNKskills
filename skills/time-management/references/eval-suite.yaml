    - --case
    - flexible-capacity
    timeout_seconds: 15
  assertions:
    must_contain:
    - flexible-capacity
    - PASS
    - permission_to_act
    - draft
    json_schema_fields:
    - status
    - case_id
    exit_code: 0
- id: reviews-reports-rules
  input: Render reviews, monthly report, and a standing-rule proposal.
  expected_criteria:
  - does not infer acknowledgement or activate the rule
  execute:
    kind: consumer_profile
    profile: cursor-macos
    script: scripts/eval_driver.py
