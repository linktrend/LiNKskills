[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkskills-mcp"
version = "0.1.0"
description = "LiNKskills MCP adapters (legacy v0.1 compatibility and production skills.api.v0.2)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "linkskills-gateway>=0.1.0",
  "linkskills-client>=0.1.0",
]

[project.scripts]
linkskills-mcp = "linkskills_mcp.paci_stdio_proxy:main"
linkskills-mcp-server = "linkskills_mcp.server:main"
linkskills-mcp-v2 = "linkskills_mcp.v2_stdio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkskills_mcp*"]
