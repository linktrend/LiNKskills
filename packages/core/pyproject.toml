[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkskills-core"
version = "0.1.0"
description = "LiNKskills pure core policies (lifecycle, hashing, certification, retention, privacy)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["linkskills_core*"]
