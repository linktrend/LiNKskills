[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkskills-publisher"
version = "0.1.0"
description = "LiNKskills Skill Pack publisher (deterministic bundles + registry)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "linkskills-core>=0.1.0",
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["linkskills_publisher*"]
