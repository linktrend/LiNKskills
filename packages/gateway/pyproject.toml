[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkskills-gateway"
version = "0.1.0"
description = "LiNKskills stdlib HTTP Gateway (skills_* JSON API)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Stdlib HTTP Gateway — no FastAPI/uvicorn. Cryptography is for PACI JWT verify
# when Platform authenticator / JWKS path is wired (optional at import for local-test).
dependencies = [
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
core = ["linkskills-core>=0.1.0"]

[project.scripts]
linkskills-gateway = "linkskills_gateway.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkskills_gateway*"]
