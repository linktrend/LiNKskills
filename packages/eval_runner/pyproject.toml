[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkskills-eval-runner"
version = "0.1.0"
description = "LiNKskills Eval Runner — observed-execution certification"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "linkskills-core>=0.1.0",
  "pyyaml>=6.0",
]

[project.scripts]
linkskills-eval-runner = "linkskills_eval_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["linkskills_eval_runner*"]
