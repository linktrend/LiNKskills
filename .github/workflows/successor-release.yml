name: Skills Successor Release

on:
  push:
    branches: [issue/372-complete-successor-hosted-release-and-qualificat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-successor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: packages/contracts:packages/core:packages/publisher:packages/eval_runner:packages/tool_runtime:packages/gateway:packages/mcp_server:packages/client:packages/librarian_domain:.
      LINKSKILLS_V2_TEST_DATABASE_URL: host=127.0.0.1 dbname=postgres user=postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked test dependencies on hosted runner
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify candidate and production regression checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          python scripts/gitops/secret_scan.py
          python -m pytest -q tests/gateway/test_production_v2.py tests/eval_runner/test_ed03_qualification.py tests/deploy/test_server01_candidate.py
      - name: Build exact linux/amd64 runtime and evaluator
        run: |
          set -euo pipefail
          mkdir -p release
          tree="$(git rev-parse HEAD^{tree})"
          docker build --pull --platform linux/amd64 -f docs/integrations/server01/Dockerfile.candidate \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" --build-arg SOURCE_TREE="$tree" \
            -t "linkskills-runtime:$GITHUB_SHA" .
          docker build --platform linux/amd64 -f docs/integrations/server01/Dockerfile.evaluator \
            --build-arg RUNTIME_IMAGE="linkskills-runtime:$GITHUB_SHA" \
            -t "linkskills-evaluator:$GITHUB_SHA" .
          docker image inspect "linkskills-runtime:$GITHUB_SHA" "linkskills-evaluator:$GITHUB_SHA" > release/images.json
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 "linkskills-runtime:$GITHUB_SHA" \
            -c 'import linkskills_gateway.production_v2, linkskills_mcp.v2_stdio; print("runtime imports PASS")'
          docker save "linkskills-runtime:$GITHUB_SHA" "linkskills-evaluator:$GITHUB_SHA" | gzip > release/images.tar.gz
          printf '{"repository":"%s","commit":"%s","tree":"%s","run_id":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$tree" "$GITHUB_RUN_ID" > release/source.json
      - name: Generate runtime SBOM
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: linkskills-runtime:${{ github.sha }}
          format: cyclonedx
          output: release/runtime-sbom.json
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: linkskills-runtime:${{ github.sha }}
          format: json
          output: release/runtime-vulnerabilities.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Bind retained artifact checksums
        run: |
          cd release
          sha256sum images.tar.gz images.json source.json runtime-sbom.json runtime-vulnerabilities.json > SHA256SUMS
      - name: Retain immutable release for Server01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linkskills-server01-${{ github.sha }}
          path: release/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
