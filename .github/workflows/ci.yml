name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging, development]

permissions:
  contents: read

jobs:
  catalog-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skills + tools registry
        run: python3 validator.py --repo-root . --scan-all

      - name: Ensure catalog index is current
        run: |
          python3 scripts/build-catalog-index.py
          python3 scripts/build-catalog-index.py --check

      - name: Install test dependencies
        run: pip install pyyaml pytest

      - name: Unit tests (skill runtime)
        run: python3 -m unittest discover -s tests/skill_runtime -v

      - name: Unit tests (internal-launch packages)
        env:
          PYTHONPATH: packages/contracts:packages/core:packages/publisher:packages/eval_runner:packages/tool_runtime:packages/gateway:packages/mcp_server:packages/client:packages/librarian_domain:.
        run: >
          python3 -m pytest
          tests/contracts tests/core tests/publisher
          tests/eval_runner tests/tool_runtime
          tests/gateway tests/mcp_server tests/client
          tests/librarian_domain tests/migrations
          -q

      - name: Service ownership gate
        run: python3 scripts/check-service-ownership.py
